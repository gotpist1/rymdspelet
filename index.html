<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rymdspelet – plugga astronomi</title>
<style>
:root{
  --blue:#3a3fb5;--blue-d:#262a85;--blue-l:#e8e9fb;--yellow:#fecb00;--yellow-d:#c79c00;
  --ink:#14213d;--muted:#4a5878;--bg:#f3f6fb;--card:#ffffff;--line:#d5deec;
  --ok:#156b2f;--ok-bg:#d9f2e0;--bad:#b3261e;--bad-bg:#fde3e1;
  --r:16px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow-d);outline-offset:2px}
header{background:radial-gradient(2px 2px at 20px 12px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 38px,#fff,transparent),radial-gradient(2px 2px at 160px 20px,#ffd23f,transparent),#0b1033;background-size:200px 60px;color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hud{max-width:900px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
.hud h1{font-size:1.05rem;margin:0;white-space:nowrap}
.hud .lvl{flex:1;min-width:0}
.hud .lvl small{display:block;font-size:.8rem;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--yellow);border-radius:99px;transition:width .5s}
.iconbtn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:12px;min-width:44px;min-height:44px;font-size:1.2rem}
.iconbtn:hover{background:rgba(255,255,255,.28)}
main{max-width:900px;margin:0 auto;padding:18px 14px 60px}
h2{margin:.2em 0 .5em;font-size:1.5rem}
h3{margin:.2em 0 .4em}
.sub{color:var(--muted);margin:0 0 1em}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.menu{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.tile{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:block;width:100%;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--blue)}
.tile .em{font-size:2rem;display:block}
.tile b{display:block;font-size:1.15rem;margin:.2em 0}
.tile span.d{color:var(--muted);font-size:.95rem}
.btn{background:var(--blue);color:#fff;border:0;border-radius:12px;padding:12px 20px;min-height:48px;font-weight:700}
.btn:hover{background:var(--blue-d)}
.btn.alt{background:var(--yellow);color:#14213d}
.btn.alt:hover{background:#ffd93d}
.btn.ghost{background:transparent;color:var(--blue);border:2px solid var(--blue)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:8px 14px;min-height:44px}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.stat{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-weight:700}
.stat .grow{flex:1}
.q{font-size:1.2rem;font-weight:600}
.q.big{font-size:1.8rem;text-align:center;padding:10px 0}
.tag{display:inline-block;background:var(--blue-l);color:var(--blue-d);border-radius:99px;padding:2px 12px;font-size:.85rem;font-weight:700;margin-bottom:8px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;min-height:56px;width:100%}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-l)}
.opt .k{background:var(--blue-l);color:var(--blue-d);border-radius:8px;min-width:30px;height:30px;display:grid;place-items:center;font-weight:800;flex:none}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600}
.fb.ok{background:var(--ok-bg);color:#0d4a1f}
.fb.bad{background:var(--bad-bg);color:#7a1610}
.fb p{margin:.3em 0 0;font-weight:400}
.mem{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.mc{min-height:104px;border-radius:14px;border:2px solid var(--blue);background:var(--blue);color:#fff;font-size:1.8rem;display:grid;place-items:center;padding:8px;text-align:center}
.mc.open{background:var(--card);color:var(--ink);border-color:var(--line);font-size:.92rem;line-height:1.3;font-weight:600}
.mc.open.term{background:var(--yellow);border-color:var(--yellow-d);font-size:1.05rem;font-weight:800}
.mc.done{background:var(--ok-bg);border-color:var(--ok);color:#0d4a1f}
.mc.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.06)}}
.sortcard{font-size:1.5rem;font-weight:800;text-align:center;padding:26px 12px;background:var(--yellow);border-radius:var(--r);border:2px solid var(--yellow-d);margin:10px 0 14px}
.buckets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.bucket{background:var(--blue);color:#fff;border:0;border-radius:14px;padding:16px 10px;font-weight:800;min-height:64px}
.bucket:hover:not(:disabled){background:var(--blue-d)}
.bucket.right{background:var(--ok)}
.bucket.wrong{background:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.list{display:grid;gap:10px}
details.t{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:0}
details.t summary{padding:12px 14px;font-weight:700;cursor:pointer;min-height:48px;display:flex;align-items:center;gap:8px}
details.t[open]{border-color:var(--blue)}
details.t .d{padding:0 14px 14px;color:var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}
.dot.m{background:var(--ok)}
input[type=search],textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;background:#fff}
textarea{min-height:90px;resize:vertical}
label.f{display:block;font-weight:700;margin:12px 0 4px}
.hint{color:var(--muted);font-size:.92rem;margin:0 0 4px}
.model{background:var(--blue-l);border-radius:12px;padding:12px 14px;margin:8px 0}
.model p{margin:.2em 0}
.pts{list-style:none;padding:0;margin:8px 0}
.pts li label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;min-height:40px}
.pts input{width:22px;height:22px;flex:none;margin-top:2px}
.prog{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 10px}
.prog>i{display:block;height:100%;background:var(--blue)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:2px dashed var(--line);border-radius:14px;padding:10px;text-align:center;color:var(--muted);font-size:.88rem}
.badge.on{border:2px solid var(--yellow-d);background:#fff8d6;color:var(--ink)}
.badge .em{font-size:1.8rem;display:block;filter:grayscale(1);opacity:.45}
.badge.on .em{filter:none;opacity:1}
.stars{font-size:2.4rem;letter-spacing:6px;color:var(--yellow-d)}
.center{text-align:center}
.done-tag{color:var(--ok);font-weight:800}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;z-index:30;transition:transform .3s;max-width:90vw;text-align:center;font-weight:700}
#toast.show{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hero{background:linear-gradient(135deg,#0b1033,#2a2f8f);color:#fff;border-radius:var(--r);padding:8px 20px 14px;margin-bottom:16px}
.hero h2{margin-top:.5em}.hero p{margin:0;opacity:.95}
.slots{margin:6px 0;padding-left:30px}
.slot{background:var(--ok-bg);border:2px solid var(--ok);color:#0d4a1f;border-radius:12px;padding:8px 12px;margin:6px 0;font-weight:600}
.pool{display:grid;gap:10px}
.transcript{display:grid;gap:8px;margin-top:14px}
.pl{display:block;width:100%;text-align:left;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--card)}
.pl b{display:block;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pl.host{background:var(--blue-l);margin-right:12%}
.pl.exp{background:#fff8d6;margin-left:12%}
.pl.now{border-color:var(--blue);box-shadow:0 0 0 3px rgba(58,63,181,.35)}
</style>
</head>
<body>
<header>
  <div class="hud">
    <button class="iconbtn" id="back" aria-label="Tillbaka till menyn" hidden>←</button>
    <h1>🚀 Rymdspelet</h1>
    <div class="lvl">
      <small id="lvlname"></small>
      <div class="bar" role="progressbar" aria-label="Erfarenhetspoäng till nästa nivå" aria-valuemin="0" aria-valuemax="100" id="xpbar"><i id="xpfill"></i></div>
    </div>
    <button class="iconbtn" id="snd" aria-label="Ljud av/på" aria-pressed="true">🔊</button>
  </div>
</header>
<main id="app"></main>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============ DATA (från Instudering-astronomi.pdf) ============ */
const SECTIONS={1:"Solsystemet",2:"Big Bang & universum",3:"Stjärnor"};
const TERMS=[
// 1 Solsystemet
{sec:1,t:"Planet",d:"En klotformad kropp som rör sig i en bana runt en stjärna utan att lysa av sig själv.",s:"Klotformad kropp i bana runt en stjärna – lyser inte själv"},
{sec:1,t:"Asteroid",d:"Ett mindre objekt av sten och metall i bana runt solen.",s:"Mindre objekt av sten och metall i bana runt solen"},
{sec:1,t:"Komet",d:"En himlakropp av is och stoft som får en lysande svans nära solen.",s:"Himlakropp av is och stoft som får en lysande svans"},
{sec:1,t:"Stenplaneter",x:1,d:"De fyra innersta planeterna (Merkurius, Venus, Jorden och Mars). De är små och har en fast yta av sten och metall.",s:"De fyra inre planeterna med fast yta av sten"},
{sec:1,t:"Jätteplaneter",x:1,d:"De fyra yttersta planeterna (Jupiter, Saturnus, Uranus och Neptunus). De är mycket stora och består mest av gas (och is), inte av fast sten.",s:"De fyra yttre, jättestora planeterna som mest är gas"},
{sec:1,t:"Dvärgplanet",x:1,d:"Ett runt objekt som kretsar runt solen men är för litet och inte har rensat sin bana från andra objekt. Exempel: Pluto.",s:"Litet runt objekt som inte rensat sin bana, t.ex. Pluto"},
{sec:1,t:"Växthuseffekt",x:1,d:"När gaser i atmosfären (t.ex. koldioxid) fångar värme så att planeten blir varmare. På Venus är den extremt stark.",s:"Gaser i atmosfären fångar värme så planeten blir varmare"},
// 2 Big Bang & universum
{sec:2,t:"The Big Bang",d:"Explosionen/expansionen för 13,8 miljarder år sedan som startade universum.",s:"Expansionen för 13,8 miljarder år sedan som startade universum"},
{sec:2,t:"Galax",d:"En enorm samling stjärnor, gas och mörk materia hophållen av gravitation.",s:"Enorm samling stjärnor, gas och mörk materia hållen av gravitation"},
{sec:2,t:"Kosmisk bakgrundsstrålning",x:1,d:"Det svaga ”ekot” från Big Bang som fortfarande kan mätas i rymden.",s:"Det svaga ”ekot” från Big Bang som vi kan mäta i rymden"},
// 3 Stjärnor
{sec:3,t:"Stjärna",d:"Ett lysande gasklot som skapar egen energi genom kärnfusion.",s:"Lysande gasklot som skapar egen energi genom kärnfusion"},
{sec:3,t:"Kärnfusion",x:1,d:"När väteatomer slås ihop till helium och enorma mängder energi frigörs. Så får stjärnor sin energi och sitt ljus.",s:"Väte slås ihop till helium och energi frigörs"},
{sec:3,t:"Nebulosa",d:"Ett stort moln av gas och stoft där stjärnor föds eller dör.",s:"Stort moln av gas och stoft där stjärnor föds eller dör"},
{sec:3,t:"Röd jätte",d:"En uppsvälld, svalare stjärna i slutskedet av sitt liv.",s:"Uppsvälld, svalare stjärna i slutskedet av sitt liv"},
{sec:3,t:"Vit dvärgstjärna",d:"Den täta, svalnande restkärnan från en mindre eller medelstor stjärna.",s:"Tät, svalnande restkärna från en mindre eller medelstor stjärna"},
{sec:3,t:"Supernova",d:"En våldsam explosion när en massiv stjärna dör.",s:"Våldsam explosion när en massiv stjärna dör"},
{sec:3,t:"Svart hål",d:"En punkt i rymden med så stark gravitation att inte ens ljus slipper ut.",s:"Plats med så stark gravitation att inte ens ljus slipper ut"}
].map((x,i)=>({...x,id:"t"+i}));
const READY=Math.ceil(TERMS.length*.8);

const FACTS=[
{sec:1,q:"Hur stor del av solsystemets massa finns i solen?",a:"Nästan allt – ca 99,8 %",w:["Ungefär hälften – 50 %","Ungefär 10 %","Ungefär 1 %"],e:"Solen har ca 99,8 % av massan. Planeter, månar m.m. är bara en liten rest."},
{sec:1,q:"Vilka två grupper delas solsystemets åtta planeter in i?",a:"Stenplaneter och jätteplaneter (gasjättar)",w:["Varma och kalla planeter","Planeter med och utan månar","Inre och yttre dvärgplaneter"],e:"Stenplaneter närmast solen, jätteplaneter längre ut."},
{sec:1,q:"Varför är Venus varmare än Merkurius, trots att Venus ligger längre från solen?",a:"Venus har en tjock atmosfär som ger en kraftig växthuseffekt",w:["Venus roterar snabbare än Merkurius","Venus har en egen värmekälla inuti","Solen lyser starkare på Venus"],e:"Atmosfären håller kvar värmen dag som natt. Merkurius saknar nästan atmosfär."},
{sec:1,q:"Vilken är den största planeten i solsystemet?",a:"Jupiter",w:["Saturnus","Neptunus","Jorden"],e:"Jupiter är störst."},
{sec:1,q:"Vad är gemensamt för jätteplaneterna?",a:"De är mycket stora och består mest av gas",w:["De har en fast yta som Jorden","De saknar månar","De ligger närmast solen"],e:"Jätteplaneterna är stora gasplaneter, ofta med ringar och många månar."},
{sec:1,q:"Varför är Pluto en dvärgplanet?",a:"Den är liten och har inte rensat sin bana från andra objekt",w:["Den har lämnat solsystemet","Den lyser av sig själv","Den kretsar inte runt solen"],e:"Pluto uppfyller inte alla krav för att vara en vanlig planet."},
{sec:1,q:"Varför ser vi planeterna lysa på natthimlen?",a:"De reflekterar solens ljus",w:["De skapar egen energi med kärnfusion","De är så heta att de glöder","De är täckta av is som lyser i mörkret"],e:"Planeter lyser inte själva – de kastar tillbaka solljus."},
{sec:2,q:"För ungefär hur länge sedan skedde Big Bang?",a:"13,8 miljarder år sedan",w:["4,6 miljarder år sedan","138 miljoner år sedan","13,8 tusen år sedan"],e:"Big Bang startade universum för 13,8 miljarder år sedan."},
{sec:2,q:"Vilka två grundämnen bildades först efter Big Bang?",a:"Väte och helium",w:["Syre och kol","Järn och guld","Kväve och neon"],e:"Väte och helium är fortfarande 99 % av den synliga materien."},
{sec:2,q:"Vad kallas ”ekot” från Big Bang som vi fortfarande kan mäta?",a:"Kosmisk bakgrundsstrålning",w:["Solvind","Gravitationsvåg","Nordsken"],e:"Kosmisk bakgrundsstrålning är ett svagt eko från Big Bang."},
{sec:2,q:"Vad händer med universums temperatur när det expanderar?",a:"Den sjunker – universum blir kallare",w:["Den stiger","Den förblir exakt densamma","Den svänger upp och ner"],e:"När universum expanderar sprids energin ut och det svalnar."},
{sec:3,q:"Vad kallas molnen av gas och stoft där stjärnor föds?",a:"Nebulosor",w:["Galaxer","Kometer","Asteroidbälten"],e:"Stjärnor föds i nebulosor."},
{sec:3,q:"Vad startar när temperaturen i mitten av ett hopdraget gasmoln blir tillräckligt hög?",a:"Kärnfusion",w:["En supernova","Ett svart hål","En röd jätte"],e:"Då slås väte ihop till helium och en stjärna är född."},
{sec:3,q:"Vad händer med en mindre eller medelstor stjärna (som solen) när bränslet tar slut?",a:"Den sväller till en röd jätte och blir sedan en vit dvärg",w:["Den exploderar som en supernova","Den blir direkt ett svart hål","Den slocknar och försvinner genast"],e:"Solen blir en röd jätte och sedan en vit dvärgstjärna."},
{sec:3,q:"Vad kallas explosionen när en mycket massiv stjärna dör?",a:"Supernova",w:["Big Bang","Nebulosa","Kometsvans"],e:"En massiv stjärna dör i en supernova."}
].map((x,i)=>({...x,id:"f"+i}));

const SORTS=[
{id:"typ",name:"Stenplanet eller jätteplanet?",em:"🪐",buckets:["Stenplanet","Jätteplanet"],items:[
["Merkurius",0],["Venus",0],["Jorden",0],["Mars",0],["Fast yta av sten och metall",0],["Liten och nära solen",0],
["Jupiter",1],["Saturnus",1],["Uranus",1],["Neptunus",1],["Består mest av gas",1],["Stor – med många månar och ringar",1]]},
{id:"himla",name:"Planet, asteroid eller komet?",em:"☄️",buckets:["Planet","Asteroid","Komet"],items:[
["Jorden",0],["Klotformad kropp i bana runt en stjärna",0],["Saturnus",0],
["Mindre objekt av sten och metall",1],["Bälte mellan Mars och Jupiter",1],["Sten och metall i bana runt solen",1],
["Is och stoft",2],["Får en lysande svans nära solen",2],["Halleys komet",2]]},
{id:"lys",name:"Lyser själv eller reflekterar solljus?",em:"✨",buckets:["Lyser själv","Reflekterar solljus"],items:[
["Solen",0],["Sirius (en stjärna)",0],["Stjärnorna på natthimlen",0],["Ljuset kommer från kärnfusion",0],
["Mars",1],["Venus",1],["Jupiter",1],["Månen",1],["Planeterna vi ser på natthimlen",1]]},
{id:"stjarna",name:"Liten eller massiv stjärna?",em:"🌟",buckets:["Liten/medelstor (som solen)","Mycket massiv stjärna"],items:[
["Vår sol",0],["Blir en röd jätte",0],["Slutar som vit dvärgstjärna",0],["Yttre lagren försvinner och kärnan svalnar",0],
["Dör i en supernova",1],["Kan bli ett svart hål",1],["Våldsam explosion i slutet",1]]}
];

const ORDERS=[
{id:"planeter",name:"Planeterna – från solen och utåt",em:"🪐",hint:"Börja med planeten närmast solen.",items:["Merkurius","Venus","Jorden","Mars","Jupiter","Saturnus","Uranus","Neptunus"]},
{id:"stjarnliv",name:"En sols-liknande stjärnas liv",em:"🌞",hint:"Från födelse till död.",items:["Nebulosa (stort moln av gas och stoft)","Gravitationen drar ihop gasen – den blir tät och het","Kärnfusion startar – en stjärna är född","Bränslet tar slut – stjärnan sväller till en röd jätte","Kvar blir en vit dvärgstjärna som svalnar"]},
{id:"bigbang",name:"Universums historia",em:"💥",hint:"Börja med Big Bang.",items:["Big Bang","Universum expanderar och svalnar","Väte och helium bildas","Stjärnor och galaxer bildas"]}
];

const REASON=[
{id:"a1",grp:"Solsystemet (fil 6)",kind:"kort",t:"Solens massa",q:"Hur många procent av solsystemets totala massa finns i solen?",parts:[
 {label:"Ditt svar",model:"Nästan allt – ungefär 99,8 %. Alla planeter, månar, asteroider och kometer tillsammans är bara en liten rest.",note:"Siffran kan stå som 99,8 % eller 99,9 % i Meitner – kolla vad ni har.",points:["Ungefär 99,8 % (nästan 100 %)","Resten är planeter, månar m.m."]}]},
{id:"a2",grp:"Solsystemet (fil 6)",kind:"kort",t:"Planeternas två grupper",q:"Solsystemet har åtta planeter som delas in i två grupper. Vad kallas de två grupperna?",parts:[
 {label:"Ditt svar",model:"Stenplaneter (de jordlika planeterna: Merkurius, Venus, Jorden, Mars) och jätteplaneter / gasjättar (Jupiter, Saturnus, Uranus, Neptunus).",note:"Boken kan använda orden jordlika planeter och gasplaneter – kolla.",points:["Stenplaneter (de fyra inre)","Jätteplaneter / gasjättar (de fyra yttre)"]}]},
{id:"a3",grp:"Solsystemet (fil 6)",kind:"forklara",t:"Varför är Venus varmast?",q:"På Merkurius är det +430 °C på solsidan men –180 °C på skuggsidan. På Venus, som ligger längre från solen, är det cirka +460 °C hela tiden. Förklara varför Venus är varmare än Merkurius dygnet runt, trots att den ligger längre från solen.",parts:[
 {label:"Förklaring",hint:"Tänk på atmosfären och växthuseffekten.",model:"Venus har en mycket tjock atmosfär av koldioxid som ger en kraftig växthuseffekt. Atmosfären fångar värmen och släpper inte ut den, och den fördelar värmen över hela planeten – därför är det lika varmt på dagsidan som på nattsidan. Merkurius har nästan ingen atmosfär, så värmen försvinner ut i rymden på nattsidan och det blir iskallt.",points:["Venus har en tjock atmosfär (koldioxid)","Växthuseffekt: värmen fångas och stannar kvar","Värmen sprids – lika varmt dag och natt","Merkurius saknar atmosfär – värmen försvinner på nattsidan"]}]},

{id:"pm",t:"Hela repetitionen",min:"ca 16 min – riktig podd med två röster",audio:"rymdpodden.mp3",lines:[["A", "Hej och varmt välkommen! Idag ska vi ge oss ut på en fantastisk resa rakt ut i rymden bland stjärnor, planeter och gigantiska moln."], ["B", "Det låter verkligen spännande! Rymden är ju så ofattbart stor, så var tycker du att vi ska börja vår resa idag?"], ["A", "Vi börjar här hemma på vår egen bakgård, nämligen i vårt eget solsystem. Det är ju den plats i rymden där vi bor tillsammans med solen."], ["B", "Just det, solen! Den känns ju som kungen i vårt solsystem eftersom den är så enorm och skiner på oss varje dag."], ["A", "Du har helt rätt i att den är kung. Faktum är att solen innehåller nästan all massa i hela vårt solsystem."], ["B", "Nästan all massa? Betyder det att om man vägde alltihop på en jättevåg, så väger solen mycket mer än alla planeter tillsammans?"], ["A", "Precis så! Solen har över nittionio procent av all massa i solsystemet, så alla åtta planeter är bara små smulor i jämförelse."], ["B", "Det är ju helt otroligt. Och runt solen åker det alltså åtta vanliga planeter, eller hur? Hur brukar man dela in dem?"], ["A", "Man brukar dela in dem i två olika grupper. De fyra innersta kallas stenplaneter, och de fyra yttersta kallas gasjättar eller jätteplaneter."], ["B", "Aha! Stenplaneter och jätteplaneter. Stenplaneterna är alltså hårda klot som man faktiskt kan stå på, precis som vår egen jord?"], ["A", "Ja, precis. Dit hör Merkurius, Venus, jorden och Mars. De är mindre och har fasta ytor av berg och sten."], ["B", "Och jätteplaneterna längre ut, vad är det som gör dem så speciella jämfört med våra små stenplaneter här nära solen?"], ["A", "Två gemensamma egenskaper för jätteplaneterna är att de är extremt stora och att de till största delen består av gas istället för sten."], ["B", "Så man kan alltså inte landa och promenera på dem som man gör på jorden, eftersom det bara är tjocka moln och gas?"], ["A", "Stämmer bra. Jupiter är den allra största planeten av dem alla i hela solsystemet, en riktig gigant bland jättarna."], ["B", "Men vänta nu, varför pratar vi bara om åtta planeter? När jag tänker på rymden tänker jag ofta på lilla Pluto också."], ["A", "Ja, många minns Pluto. Men forskarna bestämde för ett tag sedan att Pluto inte längre räknas som en vanlig planet, utan som en dvärgplanet."], ["B", "Varför fick den inte vara med i den vanliga planetklubben längre? Blev den plötsligt för liten eller vad hände?"], ["A", "Den är väldigt liten, och framför allt har den inte lyckats städa rent i sin bana runt solen från andra stenar och isklumpar."], ["B", "Aha, en riktig planet måste alltså vara tillräckligt stor och tung för att dominera sitt område helt och hållet."], ["A", "Exakt så. Pluto delar sitt område med massor av andra isiga rymdstenar, så därför kallas den dvärgplanet istället."], ["B", "Det låter rättvist. Men du, när vi tittar upp mot natthimlen ser vi ju planeterna lysa klart bredvid stjärnorna. Hur kan de lysa?"], ["A", "Det är en jättebra fråga, för en planet har inget eget ljus. Den lyser inte av sig själv på samma sätt som solen gör."], ["B", "Nej, just det! En stjärna skapar ju egen energi, men en planet är bara ett mörkt klot. Varifrån kommer då ljuset vi ser?"], ["A", "Planeterna fungerar ungefär som reflexer på natten. Solens ljus träffar planetens yta eller moln och studsar tillbaka rakt in i våra ögon."], ["B", "Vilken smart liknelse! Som en cykelreflex som lyser när en bil lyser på den med sina strålkastare i mörkret."], ["A", "Precis så enkelt är det. Vi ser bara det reflekterade solljuset som studsar mot planeten."], ["B", "Nu kom jag att tänka på en klurig sak om de två planeterna som ligger allra närmast solen, Merkurius och Venus."], ["A", "Berätta, vad tänker du på då?"], ["B", "Merkurius ligger ju allra närmast solen. På solsidan blir det jättehett, plus fyrahundratrettio grader, men på baksidan ner till minus etthundraåttio grader!"], ["A", "Ja, det är verkligen enorma skillnader mellan dag och natt på Merkurius. Från stekhet ugn till extrem djupfrys."], ["B", "Men Venus ligger ju längre bort från solen! Ändå är det ungefär plus fyrahundrasextio grader där hela tiden, både dag och natt. Hur är det möjligt?"], ["A", "Det beror på att Venus har en otroligt tjock atmosfär, ett tjockt täcke av gaser som fungerar precis som ett växthus."], ["B", "Ett växthus? Du menar som ett glashus man odlar tomater i på sommaren, där värmen stannar kvar inne i huset?"], ["A", "Ja, fast tusen gånger starkare! Solens värme kommer in genom Venus tjocka molntäcke, men värmen kan inte ta sig ut igen i rymden."], ["B", "Och på Merkurius finns det nästan ingen luft alls som kan hålla kvar värmen, så där försvinner allt ut i rymden så fort solen går ner?"], ["A", "Helt rätt tänkt! Merkurius har ingen tjock filt som värmer, medan Venus har ett supertjockt duntäcke som kapslar in hettan dygnet runt."], ["B", "Därför blir alltså Venus varmare än Merkurius dygnet runt, trots att den har ett längre avstånd till solen. Det är ju riktigt fascinerande!"], ["A", "Visst är det! Och i vårt solsystem finns det inte bara stora planeter, utan också mindre föremål som asteroider och kometer."], ["B", "Vad är egentligen skillnaden mellan en asteroid och en komet? De låter lite lika när man först hör orden."], ["A", "En asteroid är ett mindre objekt av sten och metall som rör sig i en bana runt solen, som en flygande rymdsten."], ["B", "Okej, en hård klump av sten och metall alltså. Men vad är då en komet för något spännande?"], ["A", "En komet kan du tänka på som en smutsig snöboll. Det är en himlakropp som består av is och stoft."], ["B", "En isboll! Och när den kommer nära den heta solen börjar väl isen smälta och förångas, eller hur?"], ["A", "Ja, precis! Då bildas en lång, vacker och lysande svans av gas och stoft som sträcker sig långt ut i rymden bakom den."], ["B", "Vilken häftig syn! Men du, om vi backar bandet riktigt ordentligt, hur startade egentligen hela alltet? Hur blev universum till?"], ["A", "Det hela började med det som forskarna kallar för Big Bang, den stora händelsen då hela vårt universum startade."], ["B", "För hur länge sedan hände Big Bang egentligen? Det måste ha varit väldigt länge sedan."], ["A", "Det skedde för ungefär tretton komma åtta miljarder år sedan. Det var en ofattbart kraftig explosion eller expansion som satte igång allting."], ["B", "Tretton komma åtta miljarder år! Det är så länge sedan att man nästan får ont i huvudet av att försöka föreställa sig det."], ["A", "Ja, det är verkligen svindlande. Och från allra första början fanns inte alla de ämnen och saker som vi ser runt omkring oss idag."], ["B", "Vad var det som bildades allra först då, precis efter att universum expanderade och började svalna lite?"], ["A", "Det bildades två väldigt lätta grundämnen, nämligen väte och helium. De är de allra enklaste byggstenarna i naturen."], ["B", "Väte och helium! Och de finns väl kvar i rymden än idag i ganska stora mängder, eller?"], ["A", "De utgör faktiskt fortfarande hela nittionio procent av all den synliga materian i hela universum."], ["B", "Nittionio procent! Så nästan allt som finns där ute och som vi kan se är alltså bara väte och helium?"], ["A", "Ja, alla andra tyngre ämnen, som järnet i cyklar och syret vi andas, är bara en pytteliten del av universums synliga byggstenar."], ["B", "Finns det några spår kvar idag som bevisar att Big Bang faktiskt hände för tretton komma åtta miljarder år sedan?"], ["A", "Ja, det finns ett slags eko från Big Bang som forskarna fortfarande kan mäta överallt ute i rymden med sina instrument."], ["B", "Ett eko! Det kallas väl för kosmisk bakgrundsstrålning? Som ett svagt brus som finns kvar från den allra första tiden."], ["A", "Precis så, det är som värmestrålningen som blev kvar efter den enorma starten och som har rest genom rymden ända sedan dess."], ["B", "Och universum fortsätter väl fortfarande att växa och expandera idag? Vad händer med temperaturen när rymden blir större och större?"], ["A", "I takt med att universum expanderar och sträcks ut, så sjunker temperaturen. Universum blir alltså kallare och kallare med tiden."], ["B", "Det är lite som när man släpper ut varm luft i ett jättestort rum, då sprids värmen ut och allting blir svalare."], ["A", "Det är en alldeles utmärkt liknelse! När volymen ökar späds värmen ut, och därför svalnar universum."], ["B", "Men ur alla de här gaserna som fanns efter Big Bang, hur kunde stjärnorna börja bildas? Var föds egentligen en stjärna?"], ["A", "Stjärnor föds djupt inne i gigantiska moln ute i rymden som består av gas och stoft eller damm. Ett sådant moln kallas för en nebulosa."], ["B", "Nebulosa, vilket vackert ord! Men hur går det till när ett moln av damm och gas förvandlas till en lysande stjärna?"], ["A", "Det börjar med gravitationen, alltså dragningskraften. Den drar gasen och stoftet i molnet tätare och tätare tillsammans mot mitten."], ["B", "Och när allt trycks ihop allt hårdare och tätare, då blir det väl jättevarmt där inne i mitten av klumpen?"], ["A", "Precis! Trycket och hettan stiger enormt tills det blir så extremt varmt att atomerna börjar smälta ihop. Det kallas kärnfusion."], ["B", "Kärnfusion! Det är då stjärnan tänder sin egen motor och börjar skapa massor av energi och ljus helt själv?"], ["A", "Ja, då har ett nytt lysande gasklot fötts. Det är just det som är definitionen av en stjärna: ett lysande gasklot som skapar egen energi genom kärnfusion."], ["B", "Men bränslet kan väl inte räcka i all evighet? Vad händer med en vanlig stjärna, som vår egen sol, när bränslet börjar ta slut?"], ["A", "När bränslet i mitten börjar ta slut sväller stjärnan upp och blir gigantiskt stor, men dess yta blir svalare och rödaktig. Då kallas den en röd jätte."], ["B", "En röd jätte! Den sväller alltså upp som en gigantisk röd ballong i slutskedet av sitt långa liv."], ["A", "Stämmer bra. Sedan blåser stjärnan iväg sina yttersta gasskikt ut i rymden, och kvar i mitten blir bara en liten, tät och svalnande restkärna."], ["B", "Och den lilla restkärnan har väl också ett eget namn? Kallas den inte för en vit dvärgstjärna?"], ["A", "Helt rätt! En vit dvärgstjärna är just den täta, svalnande restkärnan från en mindre eller medelstor stjärna som vår sol."], ["B", "Men om stjärnan inte är medelstor, utan istället är en riktig tungviktare, en jättestor och massiv stjärna, vad händer då när den dör?"], ["A", "Då blir slutet mycket mer dramatiskt! Istället för att bara stilla svalna exploderar den i en gigantisk, våldsam smäll som kallas supernova."], ["B", "Supernova, wow! Det måste vara en av de allra mest kraftfulla explosionerna i hela universum!"], ["A", "Det är det verkligen. Den lyser så starkt att den kan lysa klarare än en hel samling av miljarder stjärnor under en kort tid."], ["B", "Och efter en sådan enorm explosion, kan det inte bildas ett sådant där mystiskt svart hål då?"], ["A", "Jo, precis! Om kärnan som blir kvar är tillräckligt tung kollapsar den till en punkt i rymden med så otroligt stark gravitation att inte ens ljus slipper ut."], ["B", "Inte ens ljus kan smita iväg! Det är därför det kallas ett svart hål, eftersom ingenting som åker in någonsin kan studsa ut eller synas."], ["A", "Exakt så. Gravitationen där är så stark att allting sugs fast och hålls kvar för alltid."], ["B", "Och alla dessa stjärnor, nebulosor, svarta hål och planeter svävar väl inte bara runt helt ensamma i tomma intet?"], ["A", "Nej, de samlas ihop i enorma städer i rymden som vi kallar galaxer. En galax är en enorm samling stjärnor, gas och mörk materia som hålls ihop av gravitation."], ["B", "Och vår egen galax heter Vintergatan, eller hur? Där bor vi tillsammans med hundratals miljarder andra stjärnor!"], ["A", "Precis, i Vintergatan finns vår lilla sol och alla våra grannplaneter."], ["B", "Ska vi ta och göra en snabb sammanfattning av allt spännande vi har lärt oss idag, så att man verkligen kommer ihåg de viktigaste delarna?"], ["A", "Det gör vi gärna! För det första har vi vårt solsystem, där solen har över nittionio procent av all massa, och där åtta planeter snurrar runt den."], ["B", "Och planeterna delas in i de fyra inre stenplaneterna och de fyra yttre gasjättarna, där Jupiter är den allra största planeten."], ["A", "Sedan mindes vi att Pluto inte längre räknas som en vanlig planet utan som en dvärgplanet, eftersom den är liten och inte har städat rent i sin bana."], ["B", "Och vi vet varför planeterna lyser på natthimlen: de har inget eget ljus, utan reflekterar bara solens strålar som en reflex!"], ["A", "Vi förklarade också varför Venus är varmare än Merkurius dygnet runt: dess supertjocka atmosfär fungerar som ett kraftigt växthus som håller kvar värmen."], ["B", "Medan Merkurius saknar en tjock atmosfär och därför blir iskall på natten och superhet på dagen."], ["A", "Vi lärde oss också skillnaden mellan asteroider, som är rymdstenar av sten och metall, och kometer, som är isiga klumpar som får en lysande svans nära solen."], ["B", "Och så backade vi till Big Bang för tretton komma åtta miljarder år sedan, då universum startade och de lätta ämnena väte och helium bildades."], ["A", "Därifrån har vi fortfarande ett mätbart eko i rymden, och i takt med att universum fortsätter expandera blir det allt kallare."], ["B", "Sist men inte minst gick vi igenom stjärnornas livscykel: de föds i gas- och stoftmoln som kallas nebulosor med hjälp av gravitation och kärnfusion."], ["A", "Mindre stjärnor som solen sväller upp till röda jättar och slutar som vita dvärgstjärnor, medan massiva stjärnor exploderar i en supernova och kan lämna efter sig ett svart hål."], ["B", "Och alla dessa stjärnor och gasmoln samlas i gigantiska galaxer som hålls ihop av gravitationen. Vilken fantastisk rundtur i rymden!"], ["A", "Verkligen! Om du vill lära dig ännu mer om något av detta kan du själv generera en ny podcast om människans resor i rymden eller hur teleskop fungerar."]]},
{id:"p1",t:"Avsnitt 1: Solsystemet",min:"ca 3 min",lines:[

["H","Wow! Nu har jag en gåta. Merkurius ligger närmast solen, men Venus är varmare. Hur kan det komma sig?"],

["F","Venus däremot har en jättetjock atmosfär full av koldioxid. Den fångar värmen, precis som i ett växthus. Det kallas växthuseffekt. Därför är det cirka plus 460 grader på Venus hela tiden, både dag och natt."],
["H","Så det är atmosfären som avgör, inte avståndet till solen."],
["F","Precis så."],
["H","Jag har också hört att Pluto inte är en planet längre. Vad hände?"],

["H","En sak till. Planeterna lyser ju på natthimlen. Lyser de själva?"],

function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(k==="class")e.className=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,"");

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function wsample(items,k,wf){
  const arr=items.slice(),out=[];
  while(out.length<k&&arr.length){
    const ws=arr.map(wf);let r=Math.random()*ws.reduce((a,b)=>a+b,0),i=0;
    for(;i<arr.length-1;i++){r-=ws[i];if(r<=0)break}
    out.push(arr.splice(i,1)[0]);
  }
  return out;
}

let ac;
function tone(f,d,type="sine",t0=0,vol=.15){
  if(!S.sound)return;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;
    o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}

const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function confetti(){
  if(reduce)return;
  const c=$("#fx"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#005293","#fecb00","#ffffff","#2e9b4f","#e0457b"];
  const ps=Array.from({length:130},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:5+Math.random()*7,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6}));
  let f=0;

    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});

}

function termQ(t){
  const same=TERMS.filter(x=>x.sec===t.sec&&x.id!==t.id);
  let d=shuffle(same).slice(0,3);
  if(d.length<3)d=d.concat(shuffle(TERMS.filter(x=>x.id!==t.id&&!d.includes(x))).slice(0,3-d.length));
  if(Math.random()<.5)return{id:t.id,tag:"Vilket begrepp beskrivs?",prompt:t.d,opts:shuffle([{text:t.t,ok:true},...d.map(x=>({text:x.t}))]),explain:`Rätt svar: ${t.t}.`};
  return{id:t.id,tag:"Vad betyder begreppet?",prompt:t.t,big:true,opts:shuffle([{text:t.s,ok:true},...d.map(x=>({text:x.s}))]),explain:`${t.t}: ${t.d}`};
}
const factQ=f=>({id:f.id,tag:"Fakta",prompt:f.q,opts:shuffle([{text:f.a,ok:true},...f.w.map(text=>({text}))]),explain:f.e});

      h("div",{class:"stat"},h("span",{},`Fråga ${i+1}/${qs.length}`),h("span",{"aria-label":`${hearts} liv kvar`},"♥".repeat(hearts)+"♡".repeat(3-hearts)),h("span",{class:"grow"}),h("span",{},streak>1?`🔥 ${streak} i rad`:"")),
      h("div",{class:"prog"},h("i",{style:`width:${i/qs.length*100}%`})),
      h("div",{class:"card"},h("span",{class:"tag"},q.tag),h("div",{class:"q"+(q.big?" big":"")},q.prompt),h("div",{class:"opts"},optEls),fb,h("div",{style:"margin-top:12px"},next)));

      record(q.id,ok);

        score++;streak++;bestStreak=Math.max(bestStreak,streak);

    moves++;movesEl.textContent="Drag: "+moves;
    const a=first;first=null;
    if(cards[a].id===cards[k].id&&cards[a].term!==cards[k].term){
      [a,k].forEach(n=>{els[n].dataset.done="1";els[n].className="mc done";els[n].disabled=true});
      sfx.ok();addXp(5);record(cards[k].id,true);pairs++;
      if(pairs===pool.length)finish();
    }else{
      lock=true;record(cards[a].id,false);record(cards[k].id,false);sfx.bad();
      setTimeout(()=>{show(a,false);show(k,false);lock=false},1300);
    }
  }
  function finish(){
    clearInterval(timer);played();
    const stars=moves<=9?3:moves<=14?2:1,bonus=stars*10;
    if(moves<=8)unlock("memory");
    sfx.win();confetti();addXp(bonus);
    setTimeout(()=>results({title:"Alla par hittade! 🎉",stars,lines:[`${moves} drag på ${secs} sekunder · +${pairs*5+bonus} XP`],again:()=>playMemory(sec)}),1100);
  }
  app.replaceChildren(h("div",{class:"stat"},movesEl,timeEl),h("div",{class:"grid mem"},els));
}

/* ============ SORTERA ============ */
VIEWS.sort=()=>{
  app.append(h("h2",{},"🗂️ Sortera"),h("p",{class:"sub"},"Välj en sorteringsövning. Tryck på rätt låda för varje kort."),
    h("div",{class:"grid menu"},SORTS.map(s=>h("button",{class:"tile",onclick:()=>playSort(s)},h("span",{class:"em","aria-hidden":"true"},s.em),h("b",{},s.name),h("span",{class:"d"},s.buckets.join(" · "))))));
};
function playSort(set){
  const queue=shuffle(set.items).slice(0,Math.min(8,set.items.length));
  const total=queue.length;let done=0,firstTry=0,xp=0;const retried=new Set();
  function show(){
    if(!queue.length)return finish();
    const [text,right]=queue[0];let busy=false;
    const bs=set.buckets.map((b,k)=>h("button",{class:"bucket",onclick:()=>pick(k)},b));
    const card=h("div",{class:"sortcard"},text);
    app.replaceChildren(
      h("div",{class:"stat"},h("span",{},`Kort ${Math.min(done+1,total)}/${total}`),h("span",{class:"grow"}),h("span",{},`${firstTry} rätt direkt`)),
      h("div",{class:"prog"},h("i",{style:`width:${done/total*100}%`})),
      h("h3",{},set.name),card,h("div",{class:"buckets",role:"group","aria-label":"Välj låda"},bs));
    function pick(k){
      if(busy)return;busy=true;
      bs.forEach(b=>b.disabled=true);
      if(k===right){
        bs[k].classList.add("right");sfx.ok();
        if(!retried.has(text)){firstTry++;xp+=8;addXp(8)}
        queue.shift();done++;
        setTimeout(show,600);
      }else{
        bs[k].classList.add("wrong");bs[right].classList.add("right");card.classList.add("shake");sfx.bad();
        card.append(h("div",{style:"font-size:1rem;font-weight:600;margin-top:8px"},`Rätt: ${set.buckets[right]}`));
        retried.add(text);const it=queue.shift();queue.push(it);
        setTimeout(show,1700);
      }
    }
  }
  function finish(){
    played();const perfect=firstTry===total;
    if(perfect){unlock("sorter");sfx.win();confetti()}
    const stars=perfect?3:firstTry>=Math.ceil(total*.7)?2:1;
    results({title:perfect?"Felfritt! 🎉":"Klart!",stars,lines:[`${firstTry} av ${total} rätt på första försöket · +${xp} XP`],again:()=>playSort(set)});
  }
  show();
}

/* ============ LYSSNA ============ */
const synth=window.speechSynthesis;
const svVoices=()=>synth?synth.getVoices().filter(v=>/^sv/i.test(v.lang)):[];
VIEWS.listen=()=>{
  const tile=ep=>h("button",{class:"tile",onclick:()=>go("episode",ep.id)},
    h("span",{class:"em","aria-hidden":"true"},ep.audio?"🎧":"🎙️"),
    h("b",{},ep.t,S.heard[ep.id]?h("span",{class:"done-tag"}," ✓ lyssnat"):null),
    h("span",{class:"d"},ep.min));
  app.append(h("h2",{},"🎧 Rymdpodden"),
    h("p",{class:"sub"},"Lyssna klart på ett avsnitt för att få XP, och på hela podden eller alla tre kortavsnitten för en bricka. Perfekt att lyssna på innan du sover eller på bussen."),
    h("h3",{},"Hela repetitionen – två röster"),
    h("div",{class:"grid menu"},PODCAST.filter(e=>e.audio).map(tile)),
    h("h3",{style:"margin-top:22px"},"Kortare avsnitt – uppläst av enhetens röst"),
    h("div",{class:"grid menu"},PODCAST.filter(e=>!e.audio).map(tile)));
};
VIEWS.episode=id=>{
  const ep=PODCAST.find(x=>x.id===id),n=PODCAST.indexOf(ep);
  const audio=ep.audio?h("audio",{controls:true,preload:"metadata",src:ep.audio,style:"width:100%;margin-bottom:6px"}):null;
  let idx=0,playing=false,run=0,rate=1;
  const status=h("p",{class:"hint","aria-live":"polite"});
  const playBtn=h("button",{class:"btn alt",onclick:()=>playing?pause():play()},"▶ Spela");
  const restart=h("button",{class:"btn ghost",onclick:()=>{pause();idx=0;mark(-1);playBtn.textContent="▶ Spela"}},"⏮ Från början");
  const speeds=[["Lugnt",.85],["Normalt",1],["Snabbt",1.2]];
  const speedEls=h("div",{class:"chips",role:"group","aria-label":"Hastighet",style:"margin:8px 0"});
  const drawSpeeds=()=>speedEls.replaceChildren(...speeds.map(([l,v])=>h("button",{class:"chip","aria-pressed":String(rate===v),onclick:()=>{rate=v;if(audio)audio.playbackRate=v;drawSpeeds()}},l)));
  drawSpeeds();
  const label=who=>({H:"Programledare",F:"Forskare",A:"Röst 1",B:"Röst 2"})[who];
  const lineEls=ep.lines.map(([who,text],i)=>h(audio?"div":"button",{class:"pl "+(who==="H"||who==="A"?"host":"exp"),onclick:audio?null:()=>{idx=i;play()}},
    h("b",{},label(who)),h("span",{},text)));
  const showText=!audio;
  const transcript=h("div",{class:"transcript",hidden:!showText},lineEls);
  const textToggle=h("button",{class:"chip","aria-pressed":String(showText),onclick:e=>{const on=e.target.getAttribute("aria-pressed")!=="true";e.target.setAttribute("aria-pressed",String(on));transcript.hidden=!on}},"Visa text");
  const next=h("div",{style:"margin-top:14px"});
  function mark(i){
    lineEls.forEach((el,k)=>el.classList.toggle("now",k===i));
    if(i>=0&&!transcript.hidden)lineEls[i].scrollIntoView({block:"center",behavior:reduce?"auto":"smooth"});
  }
  function check(){
    if(audio){status.textContent="Hör du inget? Kolla att volymen är uppe och att enheten inte är på ljudlöst.";return true}
    if(!synth||!("SpeechSynthesisUtterance" in window)){status.textContent="Den här webbläsaren kan inte läsa upp text. Läs texten nedan istället.";playBtn.disabled=true;return false}
    if(!svVoices().length){status.textContent="Hittar ingen svensk röst på den här enheten. Läs texten nedan istället (tips: i Safari på iPad kan du lägga till en svensk röst under Inställningar → Hjälpmedel → Uppläst innehåll → Röster).";playBtn.disabled=true;return false}
    playBtn.disabled=false;status.textContent="Hör du inget? Kolla att volymen är uppe och att enheten inte är på ljudlöst.";return true;
  }
  if(audio){
    audio.addEventListener("ended",finish);
    audio.addEventListener("play",()=>{audio.playbackRate=rate});
    audio.addEventListener("error",()=>{status.textContent="Kunde inte ladda ljudet. Kolla internetanslutningen och ladda om sidan."});
  }else if(synth)synth.onvoiceschanged=check;
  check();
  function speak(){
    if(!playing)return;
    if(idx>=ep.lines.length)return finish();
    mark(idx);
    const my=++run,[who,text]=ep.lines[idx],vs=svVoices();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="sv-SE";u.voice=(who==="H"?vs[0]:(vs[1]||vs[0]))||null;
    u.pitch=who==="H"?1.1:.85;u.rate=rate;
    u.onend=()=>{if(my===run&&playing){idx++;speak()}};
    u.onerror=e=>{if(my===run&&playing&&e.error!=="canceled"&&e.error!=="interrupted"){idx++;speak()}};
    synth.speak(u);
  }
  function play(){
    if(!check())return;
    if(idx>=ep.lines.length)idx=0;
    playing=true;run++;if(synth.speaking||synth.pending)synth.cancel();
    playBtn.textContent="⏸ Pausa";speak();
  }
  function pause(){
    playing=false;run++;if(synth)synth.cancel();
    playBtn.textContent="▶ Fortsätt";
  }
  function finish(){
    playing=false;idx=0;mark(-1);playBtn.textContent="▶ Lyssna igen";
    const first=!S.heard[ep.id],xp=audio?30:15;S.heard[ep.id]=true;save();played();
    if(first){addXp(xp);toast(`🎧 Avsnittet klart! +${xp} XP`);sfx.win()}
    if(S.heard.pm||PODCAST.filter(x=>!x.audio).every(x=>S.heard[x.id]))unlock("lyssna");
    const nx=!audio&&PODCAST[n+1];
    next.replaceChildren(nx
      ?h("button",{class:"btn",onclick:()=>go("episode",nx.id)},"Nästa avsnitt ▶")
      :h("button",{class:"btn",onclick:()=>go("quiz")},"Testa dig själv i quizet ▶"));
  }
  cleanup=()=>{playing=false;run++;if(audio)audio.pause();if(synth){synth.cancel();synth.onvoiceschanged=null}};
  app.append(h("h2",{},(audio?"🎧 ":"🎙️ ")+ep.t),
    h("div",{class:"card"},audio?[audio,h("div",{class:"row"},textToggle)]:h("div",{class:"row"},playBtn,restart,textToggle),speedEls,status),
    next,transcript);
};

/* ============ ORDNA ============ */
VIEWS.order=()=>{
  app.append(h("h2",{},"🪐 Ordna"),h("p",{class:"sub"},"Tryck på korten i rätt ordning, ett i taget. Fel kort studsar tillbaka."),
    h("div",{class:"grid menu"},ORDERS.map(o=>h("button",{class:"tile",onclick:()=>playOrder(o)},h("span",{class:"em","aria-hidden":"true"},o.em),h("b",{},o.name),h("span",{class:"d"},o.items.length+" steg – "+o.hint)))));
};
function playOrder(o){
  let next=0,mistakes=0;
  const slots=h("ol",{class:"slots"});
  const pool=h("div",{class:"pool",role:"group","aria-label":"Kort att placera"});
  const msg=h("p",{class:"hint","aria-live":"polite"},o.hint);
  const btns=shuffle(o.items).map(text=>{
    const b=h("button",{class:"opt",onclick:()=>pick(text,b)},h("span",{},text));
    return b;
  });
  pool.append(...btns);
  function pick(text,b){
    if(text===o.items[next]){
      slots.append(h("li",{class:"slot"},text));
      b.remove();next++;addXp(4);sfx.ok();
      msg.textContent=next<o.items.length?"Rätt! Vilket kommer sedan?":"";
      if(next===o.items.length)finish();
    }else{
      mistakes++;sfx.bad();b.classList.add("wrong","shake");
      msg.textContent="Inte just nu – prova ett annat kort.";
      setTimeout(()=>b.classList.remove("wrong","shake"),500);
    }
  }
  function finish(){
    played();const stars=mistakes===0?3:mistakes<=2?2:1;
    if(mistakes===0)unlock("ordna");
    if(stars>=2){sfx.win();confetti()}
    addXp(stars*5);
    setTimeout(()=>results({title:mistakes===0?"Helt rätt! 🎉":"Klart!",stars,lines:[`${mistakes} felklick · +${o.items.length*4+stars*5} XP`,"Läs ordningen en gång till:"],
      extra:h("ol",{style:"text-align:left"},o.items.map(t=>h("li",{},t))),again:()=>playOrder(o)}),700);
  }
  app.replaceChildren(h("h3",{},o.name),h("div",{class:"card"},h("p",{class:"hint"},"Din ordning hittills:"),slots,msg),h("h3",{style:"margin-top:16px"},"Kort att placera"),pool);
}

/* ============ FRÅGA & SVAR ============ */
VIEWS.reason=()=>{
  const item=q=>h("button",{class:"tile",onclick:()=>go("reasonq",q.id)},
    h("b",{},q.t,S.done[q.id]?h("span",{class:"done-tag"}," ✓ klar"):null),
    h("span",{class:"d"},q.q.length>110?q.q.slice(0,107)+"…":q.q));
  const groups=[...new Set(REASON.map(q=>q.grp))];
  app.append(h("h2",{},"🔭 Fråga & svar"),
    h("p",{class:"sub"},"Det här är instuderingsfrågorna från provet. Skriv ditt svar själv först, jämför sedan med förslaget och kryssa för det du hade med. ”Förklara”-frågor är de som kräver längre svar."),
    ...groups.flatMap(g=>[h("h3",{style:"margin-top:22px"},g),h("div",{class:"grid menu"},REASON.filter(q=>q.grp===g).map(item))]));
};
VIEWS.reasonq=id=>{
  const q=REASON.find(x=>x.id===id);
  const boxes=q.parts.map(()=>[]);
  const body=h("div");
  const revealBtn=h("button",{class:"btn alt"},"Visa förslag på svar");
  q.parts.forEach(p=>{
    body.append(h("label",{class:"f"},p.label),p.hint?h("p",{class:"hint"},p.hint):null,h("textarea",{"aria-label":p.label,placeholder:"Skriv här…"}));
  });
  const review=h("div");
  revealBtn.onclick=()=>{
    revealBtn.hidden=true;
    review.replaceChildren(h("h3",{},"Förslag på svar – jämför med ditt eget"),
      ...q.parts.map((p,pi)=>h("div",{},
        h("div",{class:"model"},h("b",{},p.label),h("p",{},p.model),p.note?h("p",{class:"hint"},"ℹ️ "+p.note):null),
        h("p",{class:"hint"},"Vad hade du med?"),
        h("ul",{class:"pts"},p.points.map(pt=>{const cb=h("input",{type:"checkbox"});boxes[pi].push(cb);return h("li",{},h("label",{},cb,h("span",{},pt)))})))),
      h("button",{class:"btn",onclick:finish},"Klar – räkna poäng"));
    review.scrollIntoView({behavior:reduce?"auto":"smooth"});
  };
  function finish(){
    const ticked=boxes.flat().filter(c=>c.checked).length,all=boxes.flat().length;
    const enough=q.id==="b2"?ticked>=2:ticked===all;
    const first=!S.done[q.id];S.done[q.id]=true;save();played();
    const xp=first?Math.min(ticked,4)*5+(enough?10:0):0;
    addXp(xp);
    if(REASON.filter(x=>x.kind==="forklara").every(x=>S.done[x.id]))unlock("tank");
    if(enough){sfx.win();confetti()}else sfx.ok();
    results({title:enough?"Starkt svar! 🎉":"Bra jobbat!",stars:enough?3:ticked>0?2:1,
      lines:[`Du hade med ${ticked} av ${all} nyckelpunkter.`,xp?`+${xp} XP`:"(XP ges bara första gången – men repetition är bra!)",enough?"":"Läs förslaget en gång till och försök igen utan att titta."],
      again:()=>go("reasonq",id)});
  }
  app.append(h("h2",{},q.t),h("div",{class:"card"},h("div",{class:"q"},q.q)),body,h("div",{style:"margin-top:14px"},revealBtn),review);
};

/* ============ PLUGGA ============ */
VIEWS.study=()=>{
  let sec=0,query="",openAll=false;
  const list=h("div",{class:"list"}),chips=h("div",{class:"chips",role:"group","aria-label":"Välj avsnitt"});
  const search=h("input",{type:"search","aria-label":"Sök begrepp",placeholder:"Sök begrepp…",oninput:e=>{query=e.target.value.toLowerCase();draw()}});
  const toggle=h("button",{class:"chip","aria-pressed":"false",onclick:e=>{openAll=!openAll;e.target.setAttribute("aria-pressed",String(openAll));draw()}},"Visa alla förklaringar");
  function draw(){
    chips.replaceChildren(...[[0,"Alla"],...Object.entries(SECTIONS).map(([k,v])=>[+k,`${k}. ${v}`])].map(([k,v])=>h("button",{class:"chip","aria-pressed":String(sec===k),onclick:()=>{sec=k;draw()}},v)),toggle);
    const ts=termsFor(sec).filter(t=>!query||(t.t+" "+t.d).toLowerCase().includes(query));
    list.replaceChildren(...(ts.length?ts.map(t=>{
      const d=h("details",{class:"t"},h("summary",{},h("span",{class:"dot"+(mastered(t.id)?" m":""),title:mastered(t.id)?"Bemästrat":"Inte bemästrat än"}),t.t,t.x?h("span",{class:"hint"}," (extra)"):null),h("div",{class:"d"},t.d));
      d.open=openAll;return d;
    }):[h("p",{},"Inga begrepp hittades.")]));
  }
  draw();
  app.append(h("h2",{},"📖 Plugga begrepp"),h("p",{class:"sub"},"Tryck på ett begrepp för att se förklaringen. Tips: försök förklara det högt innan du öppnar! Grön prick = du kan det."),search,chips,list);
};

go("home");
